services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ignisguard
    ports: ["3307:3306"]
    volumes:
      - dbdata:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 5s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/ignisguard
    ports: ["8000:8000"]
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  dbdata:
